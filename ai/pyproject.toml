[project]
name = "vsl-ai"
version = "0.1.0"
description = "Nhận diện ngôn ngữ ký hiệu Việt Nam: trích điểm tay/vai bằng MediaPipe, train model nhỏ, xuất cho web"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mediapipe>=0.10.14",
  "opencv-python",
  "numpy",
  "pandas",
  "scikit-learn",
  "pytest",
  "pyarrow>=26.0.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Mạng nơ-ron (train_nn.py) chỉ cần lúc dạy, chạy trên GPU NVIDIA: uv sync --group nn
[dependency-groups]
nn = ["torch>=2.5"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
